<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMRIH2 Toolkit</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0d0f12">
<link rel="stylesheet" href="style.css?v=1bef3623">
</head>
<body>
<header>
  <div class="wrap">
    <h1>No More Room in Hell 2 <span class="tk">Toolkit</span></h1>
    <p class="tag">A player reference built straight from the game files - skills, weapons, gear, recipes and the undead.</p>
    <div id="statsBanner" class="banner hidden"></div>
  </div>
</header>

<nav id="tabs" class="wrap"></nav>

<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search everything&hellip;" autocomplete="off">
    <div id="filters" class="filters"></div>
    <button id="hideMissing" class="chip toggle" type="button"
      title="Hide entries that have no stats or shop info yet">Hide missing info</button>
    <span id="count" class="count"></span>
  </div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty hidden">Nothing matches that search.</p>
</main>

<footer>
  <div class="wrap">
    <p>Data extracted from the local game install (Steam appid 292000, UE5.6). Fan-made; not affiliated with Torn Banner Studios.</p>
    <p id="statsSource" class="dim"></p>
    <p id="wikiAttribution" class="dim"></p>
    <p id="metaline" class="dim"></p>
  </div>
</footer>

<script src="data.js?v=2ee28c2e"></script>
<script src="app.js?v=8a1ce9c1"></script>
</body>
</html>
